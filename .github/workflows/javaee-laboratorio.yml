name: Java EE — Laboratório

on:
  push:
    paths:
      - "javaee/laboratorio/**"
      - ".github/workflows/javaee-laboratorio.yml"
  pull_request:
    paths:
      - "javaee/laboratorio/**"
      - ".github/workflows/javaee-laboratorio.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javaee/laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: javaee/laboratorio/pom.xml
      - name: Build and tests (JUnit + JPA/H2)
        run: mvn --batch-mode --no-transfer-progress clean verify
