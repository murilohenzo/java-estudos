name: Java EE — Laboratório

on:
  push:
    paths:
      - "javaee/laboratorio/**"
      - ".github/workflows/javaee-laboratorio.yml"
  pull_request:
    paths:
      - "javaee/laboratorio/**"
      - ".github/workflows/javaee-laboratorio.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javaee/laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: javaee/laboratorio/pom.xml
      - name: Build and tests (JUnit + JPA/H2)
        run: mvn --batch-mode --no-transfer-progress clean verify

  glassfish-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: javaee/laboratorio
    steps:
      - uses: actions/checkout@v4
      - name: Build and start GlassFish + PostgreSQL
        run: docker compose up --build -d
      - name: Wait for JSF page response
        run: |
          for i in $(seq 1 72); do
            if curl -fsS http://127.0.0.1:8080/javaee-laboratorio/cliente.xhtml | grep -q 'Cadastro de Clientes'; then
              echo "JSF page served successfully"
              exit 0
            fi
            sleep 5
          done
          docker compose logs --tail=200 glassfish
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop local lab
        if: always()
        run: docker compose down -v
