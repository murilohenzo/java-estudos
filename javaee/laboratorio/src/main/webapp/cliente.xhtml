<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head><title>Laboratório MVC — Clientes</title></h:head>
<h:body>
    <h1>Laboratório Java EE — Cadastro de Clientes</h1>
    <h:form id="cadastro">
        <p:messages id="mensagens" showDetail="true"/>
        <p:panelGrid columns="2">
            <p:outputLabel for="nome" value="Nome"/>
            <p:inputText id="nome" value="#{clienteBean.nome}" required="true"/>
            <p:outputLabel for="email" value="E-mail"/>
            <p:inputText id="email" value="#{clienteBean.email}" required="true">
                <f:validateRegex pattern="[^@ ]+@[^@ ]+[.][^@ ]+"/>
            </p:inputText>
        </p:panelGrid>
        <p:commandButton value="Salvar" action="#{clienteBean.salvar}"
                         actionListener="#{clienteBean.antesDeSalvar}"
                         process="@form" update="@form :consulta"/>
        <p:commandButton value="Submeter sem action" process="@this"
                         update="mensagens" immediate="true"/>
        <p:commandButton value="Simular rollback" action="#{clienteBean.simularFalha}"
                         process="@form" update="@form :consulta"/>
    </h:form>
    <h:form id="consulta">
        <p:dataTable value="#{clienteBean.clientes}" var="cliente"
                     emptyMessage="Nenhum cliente cadastrado">
            <p:column headerText="ID"><h:outputText value="#{cliente.id}"/></p:column>
            <p:column headerText="Nome"><h:outputText value="#{cliente.nome}"/></p:column>
            <p:column headerText="E-mail"><h:outputText value="#{cliente.email}"/></p:column>
        </p:dataTable>
        <p:panelGrid columns="2">
            <p:outputLabel for="clienteId" value="ID do cliente"/>
            <p:inputNumber id="clienteId" value="#{pedidoBean.clienteId}"
                           decimalPlaces="0" required="true"/>
            <p:outputLabel for="descricao" value="Descrição do pedido"/>
            <p:inputText id="descricao" value="#{pedidoBean.descricao}"
                         required="true"/>
        </p:panelGrid>
        <p:commandButton value="Criar pedido" action="#{pedidoBean.criarPedido}"
                         process="@form" update="@form :cadastro:mensagens"/>
        <p:dataTable value="#{pedidoBean.pedidos}" var="pedido"
                     emptyMessage="Nenhum pedido selecionado">
            <p:column headerText="ID"><h:outputText value="#{pedido.id}"/></p:column>
            <p:column headerText="Descrição"><h:outputText value="#{pedido.descricao}"/></p:column>
        </p:dataTable>
    </h:form>
</h:body>
</html>
